[package]
name = "rust-helper"
version = "0.1.0"
edition = "2021"

[lib]
name = "rust_helper"
path = "src/lib.rs"

[[bin]]
name = "rust-helper"
path = "src/main.rs"

[dependencies]
axum = "0.7"
base64 = "0.22"
include_dir = "0.7"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
