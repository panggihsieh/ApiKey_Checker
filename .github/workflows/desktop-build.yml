name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  mac:
    name: Build macOS DMG
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: npm run check

      - name: Build DMG
        run: npm run dist:mac -- --publish never

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: api-key-checker-macos
          path: |
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/latest-mac.yml

  windows-exe:
    name: Build Windows EXE
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: npm run check

      - name: Build NSIS EXE
        run: npm run dist:win:exe -- --publish never

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: api-key-checker-windows-exe
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

  windows-msi:
    name: Build Windows MSI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y wixl

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: npm run check

      - name: Build MSI
        run: npm run dist:win:msi -- --publish never

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: api-key-checker-windows-msi
          path: |
            dist/*.msi
            dist/wixl-project.wxs

  windows-portable:
    name: Build Windows Portable
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: npm run check

      - name: Build Portable EXE
        run: npm run dist:win:portable -- --publish never

      - name: Upload Windows Portable
        uses: actions/upload-artifact@v4
        with:
          name: api-key-checker-windows-portable
          path: |
            dist/*portable*.exe
            dist/*.blockmap
            dist/latest.yml

  release:
    name: Publish GitHub release
    needs:
      - mac
      - windows-exe
      - windows-msi
      - windows-portable
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: api-key-checker-macos
          path: release-assets

      - name: Download Windows EXE artifacts
        uses: actions/download-artifact@v4
        with:
          name: api-key-checker-windows-exe
          path: release-assets

      - name: Download Windows MSI artifacts
        uses: actions/download-artifact@v4
        with:
          name: api-key-checker-windows-msi
          path: release-assets

      - name: Download Windows Portable artifacts
        uses: actions/download-artifact@v4
        with:
          name: api-key-checker-windows-portable
          path: release-assets

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-assets/* --clobber
          else
            gh release create "$TAG_NAME" release-assets/* --title "$TAG_NAME" --generate-notes
          fi
