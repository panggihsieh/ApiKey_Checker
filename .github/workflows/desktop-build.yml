name: Desktop portable releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  mac-normal:
    name: Build normal macOS portable DMG
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: npm run check

      - name: Build DMG
        run: npm run dist:mac -- --publish never

      - name: Upload normal portable DMG
        uses: actions/upload-artifact@v4
        with:
          name: api-key-checker-normal-mac-portable
          path: dist/*-normal-mac-*-portable.dmg

  mac-rust:
    name: Build Rust macOS portable DMG
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: rust/package-lock.json

      - name: Setup Rust
        run: rustup default stable

      - name: Install Tauri dependencies
        working-directory: rust
        run: npm ci

      - name: Test Rust workspace
        working-directory: rust
        run: cargo test --workspace

      - name: Build Rust portable DMG
        working-directory: rust
        run: |
          npm run build:dmg
          VERSION=$(node -p "require('./package.json').version")
          case "$(uname -m)" in
            arm64) ARCH=arm64 ;;
            x86_64) ARCH=x64 ;;
            *) ARCH=$(uname -m) ;;
          esac
          SOURCE=$(find target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' | head -n 1)
          test -n "$SOURCE"
          mv "$SOURCE" "target/release/bundle/dmg/API-Key-Checker-${VERSION}-rust-mac-${ARCH}-portable.dmg"

      - name: Upload Rust portable DMG
        uses: actions/upload-artifact@v4
        with:
          name: api-key-checker-rust-mac-portable
          path: rust/target/release/bundle/dmg/*-rust-mac-*-portable.dmg

  windows-normal:
    name: Build normal Windows portable
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: npm run check

      - name: Build Portable EXE
        run: npm run dist:win:portable -- --publish never

      - name: Upload normal Windows portable
        uses: actions/upload-artifact@v4
        with:
          name: api-key-checker-normal-windows-portable
          path: dist/*-normal-windows-*-portable.exe

  windows-rust:
    name: Build Rust Windows portable
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: rust/package-lock.json

      - name: Setup Rust
        run: rustup default stable

      - name: Install Tauri dependencies
        working-directory: rust
        run: npm ci

      - name: Test Rust workspace
        working-directory: rust
        run: cargo test --workspace

      - name: Build Rust portable
        working-directory: rust
        run: npm run build:portable

      - name: Upload Rust Windows portable
        uses: actions/upload-artifact@v4
        with:
          name: api-key-checker-rust-windows-portable
          path: rust/target/release/bundle/portable/*-rust-windows-*-portable.exe

  windows-cpp:
    name: Build cpp Windows portable
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build cpp portable
        run: npm run cpp:build:portable

      - name: Upload cpp Windows portable
        uses: actions/upload-artifact@v4
        with:
          name: api-key-checker-cpp-windows-portable
          path: cpp/dist/*-cpp-windows-*-portable.exe

  release:
    name: Publish GitHub release
    needs:
      - mac-normal
      - mac-rust
      - windows-normal
      - windows-rust
      - windows-cpp
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download portable artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: api-key-checker-*-portable
          path: release-assets
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "$TAG_NAME rust cpp normal"
            gh release upload "$TAG_NAME" release-assets/* --clobber
          else
            gh release create "$TAG_NAME" release-assets/* --title "$TAG_NAME rust cpp normal" --generate-notes
          fi
