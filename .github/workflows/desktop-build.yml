name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  mac:
    name: Build macOS DMG
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: npm run check

      - name: Build DMG
        run: npm run dist:mac -- --publish never

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: api-key-checker-macos
          path: dist/*.dmg

  windows-portable:
    name: Build Windows Portable
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: npm run check

      - name: Build Portable EXE
        run: npm run dist:win:portable -- --publish never

      - name: Upload Windows Portable
        uses: actions/upload-artifact@v4
        with:
          name: api-key-checker-windows-portable
          path: dist/*portable*.exe

  windows-tauri:
    name: Build Windows Tauri EXE
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: rust/package-lock.json

      - name: Setup Rust
        run: rustup default stable

      - name: Install Tauri dependencies
        working-directory: rust
        run: npm ci

      - name: Test Rust workspace
        working-directory: rust
        run: cargo test --workspace

      - name: Build Tauri installer
        working-directory: rust
        run: npm run build:exe

      - name: Build Tauri portable
        working-directory: rust
        run: npm run build:portable

      - name: Upload Windows Tauri EXE
        uses: actions/upload-artifact@v4
        with:
          name: api-key-checker-windows-rust-release
          path: |
            rust/target/release/bundle/nsis/*.exe
            rust/target/release/bundle/portable/*.exe

  windows-cplus2:
    name: Build Windows Cplus2 Portable
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build Cplus2 portable
        run: npm run cpp:build:portable

      - name: Upload Windows Cplus2 Portable
        uses: actions/upload-artifact@v4
        with:
          name: api-key-checker-windows-Cplus2-portable
          path: cpp/dist/*Cplus2*.exe

  release:
    name: Publish GitHub release
    needs:
      - mac
      - windows-portable
      - windows-tauri
      - windows-cplus2
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: api-key-checker-macos
          path: release-assets

      - name: Download Windows Portable artifacts
        uses: actions/download-artifact@v4
        with:
          name: api-key-checker-windows-portable
          path: release-assets

      - name: Download Windows Tauri artifacts
        uses: actions/download-artifact@v4
        with:
          name: api-key-checker-windows-rust-release
          path: release-assets

      - name: Download Windows Cplus2 artifacts
        uses: actions/download-artifact@v4
        with:
          name: api-key-checker-windows-Cplus2-portable
          path: release-assets

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-assets/* --clobber
          else
            gh release create "$TAG_NAME" release-assets/* --title "$TAG_NAME" --generate-notes
          fi
